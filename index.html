<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D模型查看器</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body data-theme="dark">
    <div id="app">
        <header class="header">
            <button id="mobile-models-btn" class="mobile-nav-btn" title="模型列表">☰</button>
            <h1>3D模型查看器</h1>
            <div class="header-info">
                <span id="model-info">等待加载模型...</span>
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="切换皮肤">🌙</button>
            </div>
        </header>

        <!-- 移动端遮罩层 -->
        <div id="mobile-overlay" class="mobile-overlay"></div>

        <div class="main-container">
            <aside class="sidebar sidebar-left">
                <div class="panel">
                    <h2>模型浏览</h2>
                    <div class="model-tree-search">
                        <input type="text" id="model-search" placeholder="搜索模型..." autocomplete="off">
                    </div>
                    <div id="model-tree" class="model-tree">
                        <div class="tree-loading">加载模型列表...</div>
                    </div>
                </div>
            </aside>

            <main class="viewer-container">
                <canvas id="canvas"></canvas>
                <canvas id="mmd-canvas"></canvas>
                <div id="orientation-indicator" class="orientation-indicator">
                    <svg id="orientation-svg" width="100" height="100" viewBox="-50 -50 100 100">
                        <circle cx="0" cy="0" r="45" fill="rgba(0,0,0,0.4)" stroke="rgba(233,69,96,0.6)" stroke-width="1.5"/>
                        <circle cx="0" cy="0" r="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                        <circle cx="0" cy="0" r="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                        <line x1="-45" y1="0" x2="45" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
                        <line x1="0" y1="-45" x2="0" y2="45" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
                        <g id="orientation-axes">
                            <line x1="0" y1="0" x2="0" y2="-35" stroke="#e94560" stroke-width="2"/>
                            <line x1="0" y1="0" x2="30" y2="0" stroke="#4CAF50" stroke-width="2"/>
                            <line x1="0" y1="0" x2="-20" y2="15" stroke="#2196F3" stroke-width="2"/>
                            <circle cx="0" cy="-35" r="3" fill="#e94560"/>
                            <text x="0" y="-40" text-anchor="middle" fill="#e94560" font-size="9">Y</text>
                            <circle cx="30" cy="0" r="3" fill="#4CAF50"/>
                            <text x="38" y="3" fill="#4CAF50" font-size="9">X</text>
                            <circle cx="-20" cy="15" r="3" fill="#2196F3"/>
                            <text x="-28" y="22" fill="#2196F3" font-size="9">Z</text>
                        </g>
                    </svg>
                    <div id="orientation-info" class="orientation-info">
                        <div>缩放: <span id="zoom-value">500</span></div>
                        <div>X: <span id="angle-x-value">0°</span></div>
                        <div>Y: <span id="angle-y-value">17°</span></div>
                    </div>
                </div>
                <div id="loading-overlay" class="loading-overlay hidden">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">加载中...</div>
                </div>
                <input type="file" id="mmd-motion-input" accept=".vmd" multiple style="display:none">
            </main>

            <aside class="sidebar sidebar-right">
                <div class="sidebar-right-handle" id="sidebar-right-handle">
                    <div class="handle-bar"></div>
                    <span class="handle-text">动作与设置</span>
                </div>

                <!-- 桌面端布局：两个panel -->
                <div class="desktop-layout">
                <div class="panel panel-anim">
                    <h2 class="panel-title">动作列表</h2>
                    <button id="mmd-load-motion-btn" class="btn mmd-only" type="button">上传 VMD 动作</button>
                    <div class="animation-hint mmd-only">内置常见动作已自动加载，点击即可播放</div>
                    <div id="animation-list" class="animation-list">
                        <div class="animation-empty">加载模型后显示动作</div>
                    </div>
                    <div class="animation-buttons">
                        <button id="play-btn" class="btn">播放</button>
                        <button id="pause-btn" class="btn">暂停</button>
                        <button id="stop-btn" class="btn">停止</button>
                    </div>
                    <div class="animation-options">
                        <label>
                            <input type="checkbox" id="loop-checkbox" checked>
                            循环播放
                        </label>
                    </div>
                    <div class="speed-control">
                        <label for="speed-slider">播放速度: <span id="speed-value">1.0x</span></label>
                        <input type="range" id="speed-slider" min="0.05" max="3" step="0.05" value="1">
                    </div>
                </div>

                <div class="panel panel-display">
                    <h2 class="panel-title">视角与显示</h2>
                    <div class="camera-controls">
                        <div class="camera-buttons-row">
                            <button id="reset-camera-btn" class="btn">重置视角</button>
                            <button id="auto-rotate-btn" class="btn">自动旋转</button>
                        </div>
                    </div>
                    <div class="display-options">
                        <label class="mdx-only">
                            <input type="checkbox" id="wireframe-checkbox">
                            线框模式
                        </label>
                        <div class="bg-color-control">
                            <label for="bg-color-input">背景颜色:</label>
                            <div class="bg-color-row">
                                <input type="color" id="bg-color-input" value="#1a1a2e">
                                <div class="bg-color-presets">
                                    <button class="bg-preset" data-color="#1a1a2e" title="深夜蓝"></button>
                                    <button class="bg-preset" data-color="#0a0a15" title="深黑"></button>
                                    <button class="bg-preset" data-color="#2d1b4e" title="紫色"></button>
                                    <button class="bg-preset" data-color="#3d2817" title="棕色"></button>
                                    <button class="bg-preset" data-color="#0f2027" title="青蓝"></button>
                                    <button class="bg-preset" data-color="#c8d0e0" title="浅蓝"></button>
                                    <button class="bg-preset" data-color="#e8e4d8" title="米白"></button>
                                    <button class="bg-preset" data-color="#2b4a2b" title="森绿"></button>
                                </div>
                            </div>
                        </div>
                        <label class="mdx-only">
                            队伍颜色:
                            <select id="team-color-select">
                                <option value="-1">中立（原色）</option>
                                <option value="0">玩家1（红色）</option>
                                <option value="1">玩家2（蓝色）</option>
                                <option value="2">玩家3（青色）</option>
                                <option value="3">玩家4（紫色）</option>
                                <option value="4">玩家5（黄色）</option>
                                <option value="5">玩家6（橙色）</option>
                                <option value="6">玩家7（绿色）</option>
                                <option value="7">玩家8（粉色）</option>
                                <option value="8">玩家9（灰色）</option>
                                <option value="9">玩家10（浅蓝色）</option>
                                <option value="10">玩家11（深绿色）</option>
                                <option value="11">玩家12（棕色）</option>
                            </select>
                        </label>
                    </div>
                </div>
                </div>

                <!-- 移动端紧凑布局：5行 -->
                <div class="mobile-compact">
                    <!-- 行1：动作下拉 -->
                    <div class="mc-row mc-row-1">
                        <button class="animation-dropdown-trigger" id="animation-dropdown-trigger-m" type="button" aria-expanded="false">
                            <span class="dropdown-label">动作</span>
                            <span class="dropdown-current" id="animation-current-name-m">未选择</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div id="animation-list-m" class="animation-list animation-list-m">
                            <div class="animation-empty">加载模型后显示动作</div>
                        </div>
                    </div>
                    <!-- 行2：播放 暂停 停止 循环 -->
                    <div class="mc-row mc-row-2">
                        <button class="btn mc-btn" id="play-btn-m">播放</button>
                        <button class="btn mc-btn" id="pause-btn-m">暂停</button>
                        <button class="btn mc-btn" id="stop-btn-m">停止</button>
                        <button class="btn mc-btn mmd-only" id="mmd-load-motion-btn-m" type="button" title="上传 VMD 动作">VMD</button>
                        <label class="mc-check">
                            <input type="checkbox" id="loop-checkbox-m" checked>
                            <span>循环</span>
                        </label>
                    </div>
                    <!-- 行3：速度滑块 -->
                    <div class="mc-row mc-row-3">
                        <span class="mc-speed-label">速度 <span id="speed-value-m">1.0x</span></span>
                        <input type="range" id="speed-slider-m" min="0.05" max="3" step="0.05" value="1">
                    </div>
                    <!-- 行4：重置 自转 线框 -->
                    <div class="mc-row mc-row-4">
                        <button class="btn mc-btn" id="reset-camera-btn-m">重置</button>
                        <button class="btn mc-btn" id="auto-rotate-btn-m">自转</button>
                        <label class="mc-check mdx-only">
                            <input type="checkbox" id="wireframe-checkbox-m">
                            <span>线框</span>
                        </label>
                    </div>
                    <!-- 行5：背景色 队伍色 -->
                    <div class="mc-row mc-row-5">
                        <label class="mc-color">
                            <span>背景</span>
                            <input type="color" id="bg-color-input-m" value="#1a1a2e">
                        </label>
                        <label class="mc-select mdx-only">
                            <span>队伍</span>
                            <select id="team-color-select-m">
                                <option value="-1">中立</option>
                                <option value="0">红</option>
                                <option value="1">蓝</option>
                                <option value="2">青</option>
                                <option value="3">紫</option>
                                <option value="4">黄</option>
                                <option value="5">橙</option>
                                <option value="6">绿</option>
                                <option value="7">粉</option>
                                <option value="8">灰</option>
                                <option value="9">浅蓝</option>
                                <option value="10">深绿</option>
                                <option value="11">棕</option>
                            </select>
                        </label>
                    </div>
                </div>
            </aside>
        </div>

        <footer class="footer">
            <p>使用 mdx-m3-viewer/WebGL 构建 | 魔兽争霸3及MMD模型查看器 | 仅供娱乐喵</p>
        </footer>
    </div>

    <!-- 移动端调试日志面板 -->
    <div id="debug-panel" class="debug-panel">
        <div class="debug-panel-header" id="debug-panel-header">
            <span class="debug-panel-title">📋 调试日志</span>
            <div class="debug-panel-controls">
                <button id="debug-clear-btn">清空</button>
                <button id="debug-close-btn">关闭</button>
            </div>
        </div>
        <div class="debug-panel-body" id="debug-panel-body"></div>
    </div>
    <button id="debug-toggle-btn" class="debug-toggle-btn" title="打开调试日志">🐛</button>
</body>
</html>
